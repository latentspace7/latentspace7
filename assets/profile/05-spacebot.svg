        <path d="M74 64c10 6 16 16 14 28M90 60c8 8 12 18 10 28" fill="none" stroke="#c4b5fd" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <path class="rb-limb-edge" d="M53 92l-3 11 7 8"/><path class="rb-limb" d="M53 92l-3 11 7 8"/>
      <path class="rb-limb-edge" d="M63 92l4 10 8 4"/><path class="rb-limb" d="M63 92l4 10 8 4"/>
      <circle cx="50" cy="103" r="1.9" fill="#a39cb8"/>
      <circle cx="67" cy="102" r="1.9" fill="#a39cb8"/>
      <path class="rb-limb-edge" d="M44 64H34l-10-3"/><path class="rb-limb" d="M44 64H34l-10-3"/>
      <circle cx="34" cy="64" r="1.9" fill="#a39cb8"/>
      <rect x="15" y="56.5" width="9" height="8" rx="3.5" fill="url(#rb-shell)" stroke="#cfc9dc" stroke-width=".8"/>
      <path d="M17 58.5v4M19.5 58.5v4M22 58.5v4" stroke="#bdb6cc" stroke-width=".8" stroke-linecap="round"/>
      <ellipse cx="58" cy="76" rx="15" ry="17" fill="url(#rb-shell)" stroke="#d6d0e3" stroke-width=".8"/>
      <rect x="53" y="72" width="10" height="3" rx="1.5" fill="#7fe7ff" filter="url(#rb-glow)"/>
      <ellipse cx="58" cy="91.5" rx="10" ry="3.2" fill="#24212e"/>
      <path d="M44 62q14 9 28 0" fill="none" stroke="url(#rb-cape)" stroke-width="4" stroke-linecap="round"/>
      <g class="rb-arm">
        <path class="rb-limb-edge" d="M72 64l12-4 10-10"/><path class="rb-limb" d="M72 64l12-4 10-10"/>
        <circle cx="84" cy="60" r="1.9" fill="#a39cb8"/>
        <path d="M92 45.5l-1-3.2M95 44.5v-3.6M98 45.5l1.2-3M99.5 49l2.6-1.4" stroke="#cfc9dc" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="95" cy="49" r="4.6" fill="url(#rb-shell)" stroke="#cfc9dc" stroke-width=".8"/>
      </g>
      <circle cx="44" cy="64" r="3.4" fill="#24212e"/>
      <circle cx="72" cy="64" r="3.4" fill="#24212e"/>
      <ellipse cx="58" cy="58" rx="6" ry="2.5" fill="#24212e"/>
      <path d="M70 16l6-9" stroke="#d6d0e3" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="76.5" cy="6.5" r="2" fill="#ffffff" stroke="#d6d0e3" stroke-width=".8"/>
      <circle cx="33.5" cy="36" r="5" fill="url(#rb-shell)" stroke="#d6d0e3" stroke-width=".8"/>
      <ellipse cx="58" cy="35" rx="25" ry="21" fill="url(#rb-shell)" stroke="#d6d0e3" stroke-width=".8"/>
      <rect x="39" y="24" width="38" height="21" rx="10.5" fill="url(#rb-screen)"/>
      <path d="M44 27.5c4-1.6 10-2.2 16-2" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
      <g class="rb-eyes" filter="url(#rb-glow)">
        <path d="M46.5 36.5q4-5 8 0M61.5 36.5q4-5 8 0" fill="none" stroke="#8fe9ff" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <path d="M54.5 39.5q3.5 3 7 0" fill="none" stroke="#8fe9ff" stroke-width="1.8" stroke-linecap="round" filter="url(#rb-glow)"/>
      <circle cx="83.5" cy="36" r="7.5" fill="url(#rb-shell)" stroke="#cfc9dc" stroke-width=".8"/>
      <circle cx="83.5" cy="36" r="5" fill="none" stroke="#bdb6cc" stroke-width=".9"/>
      <circle cx="83.5" cy="36" r="2.6" fill="#e3dff0" stroke="#bdb6cc" stroke-width=".8"/>
    </g>
  </g>
</svg></g>
  <path d="M963 74Q963 61 976 61H1075Q1088 61 1088 74V117Q1088 130 1075 130H991L972 146V130Q963 130 963 117Z" fill="#354d71" stroke="#91c6ff" stroke-width="1.5" />
  <g fill="#91c6ff">
    <circle cx="996" cy="96" r="4" />
    <circle cx="1025" cy="96" r="4" />
    <circle cx="1054" cy="96" r="4" />
  </g>
  <text x="970" y="192" font-family="Menlo, Consolas, monospace" font-size="14" fill="#c1cde0" letter-spacing="1">SAY HELLO ↗</text>
</svg>
