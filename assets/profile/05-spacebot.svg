<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">05 — Spacebot. The bot behind Spacy.</title>
  <desc id="desc">A friendly white robot with a violet cape and a glowing visor smile waves beside a chat bubble, on a slate blue background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#2b405e" />
      <stop offset="1" stop-color="#203149" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6b9e8" stroke-opacity=".09" />
    </pattern>
  </defs>
  <rect width="1200" height="240" rx="18" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="238" rx="17" fill="url(#grid)" stroke="#536b8b" />
  <rect y="26" width="4" height="188" fill="#91c6ff" />
  <g font-family="Menlo, Consolas, monospace" font-size="15">
    <text x="38" y="48" fill="#91c6ff">05</text>
    <text x="90" y="48" fill="#c1cde0" letter-spacing="1.7">CHAT + VOICE UI / MEET SPACY</text>
  </g>
  <text x="37" y="124" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="700" letter-spacing="-1" fill="#f4f2ff">Spacebot</text>
  <text x="39" y="175" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d1dbee">A little character. A proper conversation.</text>
  <path d="M40 209H650" stroke="#91c6ff" stroke-opacity=".24" />
  <circle cx="1144" cy="48" r="19" fill="#91c6ff" fill-opacity=".09" />
  <path d="M1137 55L1151 41M1137 41H1151V55" stroke="#91c6ff" stroke-width="1.5" fill="none" />
  <g transform="translate(752 26) scale(1.5)"><svg width="120" height="120" viewBox="0 0 120 120" overflow="visible">
  <style>
    .rb-body { animation: rb-hover 3.2s ease-in-out infinite; }
    .rb-shadow { transform-box: fill-box; transform-origin: center; animation: rb-shadow 3.2s ease-in-out infinite; }
    .rb-cape { transform-origin: 58px 62px; animation: rb-cape 1.4s ease-in-out infinite alternate; }
    .rb-arm { transform-origin: 72px 64px; animation: rb-wave 2.8s ease-in-out infinite; }
    .rb-eyes { transform-box: fill-box; transform-origin: center; animation: rb-blink 5s infinite; }
    .rb-limb-edge { fill: none; stroke: #cfc9dc; stroke-width: 8.6; stroke-linecap: round; stroke-linejoin: round; }
    .rb-limb { fill: none; stroke: #f8f7fc; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes rb-hover { 50% { transform: translateY(-3px); } }
    @keyframes rb-shadow { 50% { transform: scaleX(0.82); opacity: 0.7; } }
    @keyframes rb-cape { to { transform: skewY(-5deg) scaleX(1.04); } }
    @keyframes rb-wave { 0%, 60%, 100% { transform: rotate(0); } 15%, 45% { transform: rotate(16deg); } 30% { transform: rotate(-10deg); } }
    @keyframes rb-blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .rb-body, .rb-shadow, .rb-cape, .rb-arm, .rb-eyes { animation: none; } }
  </style>
  <defs>
    <linearGradient id="rb-shell" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#efedf5"/><stop offset="1" stop-color="#c9c4d8"/></linearGradient>
    <linearGradient id="rb-cape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="0.55" stop-color="#6a45e4"/><stop offset="1" stop-color="#3d2499"/></linearGradient>
    <linearGradient id="rb-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2638"/><stop offset="1" stop-color="#07060c"/></linearGradient>
    <filter id="rb-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse class="rb-shadow" cx="60" cy="116" rx="20" ry="2.6" fill="#3d2499" fill-opacity=".14"/>
  <g class="rb-body">
    <g transform="rotate(-6 60 70)">
